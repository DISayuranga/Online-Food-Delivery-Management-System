<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white">

<!-- Dynamic Navbar -->
<nav id="cravebite-nav"></nav>

<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
    <div class="mb-6 flex justify-between items-center">
        <h1 class="text-3xl font-black text-gray-900">Leave a Review</h1>
        <a href="/my-reviews.html" class="text-sm font-bold text-gray-500 hover:text-orange-500 transition">&larr; Back to Reviews</a>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        <form id="reviewForm" class="space-y-6">
            
            <p class="text-sm text-gray-500 font-medium">Your feedback helps local restaurants and riders maintain exceptional quality!</p>

            <div>
                <label for="reviewType" class="block text-sm font-bold text-gray-700 mb-2">What are you reviewing?</label>
                <select name="reviewType" id="reviewType" required onchange="handleTypeChange()"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-medium outline-none focus:border-orange-500 transition">
                    <option value="FOOD">Food Quality • Restaurant Dish</option>
                    <option value="DELIVERY">Delivery Service • Rider</option>
                </select>
            </div>

            <div>
                <label id="targetLabel" for="targetId" class="block text-sm font-bold text-gray-700 mb-2">Select Item</label>
                <select name="targetId" id="targetId"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-medium outline-none focus:border-orange-500 transition">
                    <option value="">General Review • No specific target</option>
                </select>
            </div>

            <div>
                <label for="rating" class="block text-sm font-bold text-gray-700 mb-2">Star Rating</label>
                <select name="rating" id="rating" required
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-medium outline-none focus:border-orange-500 transition">
                    <option value="5">⭐⭐⭐⭐⭐ 5/5 - Outstanding</option>
                    <option value="4">⭐⭐⭐⭐ 4/5 - Very Good</option>
                    <option value="3">⭐⭐⭐ 3/5 - Average</option>
                    <option value="2">⭐⭐ 2/5 - Needs Improvement</option>
                    <option value="1">⭐ 1/5 - Disappointing</option>
                </select>
            </div>

            <div>
                <label for="comments" class="block text-sm font-bold text-gray-700 mb-2">Your Experience</label>
                <textarea name="comments" id="comments" rows="4" required placeholder="Tell us how the food tasted or how prompt the delivery was..."
                          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-medium outline-none focus:border-orange-500 transition"></textarea>
            </div>

            <div class="pt-4 border-t border-gray-100 flex gap-3">
                <a href="/my-reviews.html" class="w-1/2 py-3 px-4 text-center border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition">Cancel</a>
                <button type="submit"
                        class="w-1/2 py-3 px-4 rounded-xl text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/20 transition">
                    Submit Review
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    let foodItems = [];
    let riders = [];

    fetch('http://localhost:8080/api/reviews/form-data')
        .then(res => res.json())
        .then(data => {
            foodItems = data.foodItems || [];
            riders = data.riders || [];
            handleTypeChange();
        })
        .catch(err => {
            console.error("Failed to load review options:", err);
        });

    function handleTypeChange() {
        const type = document.getElementById('reviewType').value;
        const targetLabel = document.getElementById('targetLabel');
        const targetSelect = document.getElementById('targetId');

        targetSelect.innerHTML = '<option value="">General Review • No specific target</option>';

        if (type === 'FOOD') {
            targetLabel.innerText = "Select Food Dish";
            foodItems.forEach(item => {
                targetSelect.innerHTML += `<option value="${item.id}">🍔 ${item.name}</option>`;
            });
        } else if (type === 'DELIVERY') {
            targetLabel.innerText = "Select Delivery Rider";
            riders.forEach(r => {
                targetSelect.innerHTML += `<option value="${r.id}">🛵 ${r.name}</option>`;
            });
        }
    }

    document.getElementById('reviewForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        const params = new URLSearchParams();
        params.append('username', username);
        params.append('reviewType', fd.get('reviewType'));
        params.append('rating', fd.get('rating'));
        params.append('comments', fd.get('comments'));
        const targetId = fd.get('targetId');
        if (targetId) {
            params.append('targetId', targetId);
        }

        fetch('http://localhost:8080/api/reviews/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/my-reviews.html';
            } else {
                alert(data.error || 'Failed to submit review');
            }
        })
        .catch(err => {
            alert('Server error submitting review');
        });
    });
</script>
<script src="/js/navbar.js"></script>
</body>
</html>
