<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - CraveBite Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white flex flex-col">

<!-- Dynamic Role Navbar -->
<nav id="cravebite-nav"></nav>

<main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 pb-6 border-b border-gray-200">
        <div>
            <div class="flex items-center gap-2">
                <span class="bg-amber-100 text-amber-800 font-extrabold px-3 py-1 rounded-full text-xs uppercase tracking-wider">Dish Feedback</span>
                <span id="owner-name" class="text-xs text-gray-500 font-medium"></span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight mt-1">Customer Reviews & Ratings</h1>
            <p class="text-gray-500 text-sm">Direct feedback submitted by customers for your culinary items.</p>
        </div>
        <div>
            <button onclick="loadReviews()" class="bg-white hover:bg-gray-100 text-gray-700 px-4 py-2.5 rounded-2xl border border-gray-200 font-bold transition flex items-center gap-2 text-sm shadow-sm">
                <span>🔄</span> Refresh Reviews
            </button>
        </div>
    </div>

    <!-- Rating Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Dish Reviews</span>
            <div class="text-3xl font-black text-gray-900 mt-2" id="total-reviews-count">0</div>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Average Rating</span>
            <div class="text-3xl font-black text-amber-500 mt-2 flex items-center gap-2">
                <span id="avg-rating">0.0</span> <span class="text-xl">⭐</span>
            </div>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Satisfaction Rate</span>
            <div class="text-3xl font-black text-green-600 mt-2" id="satisfaction-rate">100%</div>
        </div>
    </div>

    <!-- Reviews Grid -->
    <div id="reviews-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="col-span-full bg-white p-12 rounded-3xl border border-gray-100 text-center">
            <p class="text-gray-400 font-medium animate-pulse">Loading dish reviews...</p>
        </div>
    </div>
</main>

<footer class="bg-gray-900 py-8 text-gray-400 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs">
        <p>&copy; 2026 CraveBite Inc. Restaurant Operations.</p>
    </div>
</footer>

<script src="/js/navbar.js"></script>
<script>
    const username = localStorage.getItem('username');
    const role = (localStorage.getItem('role') || '').toUpperCase();

    if (!username || (role !== 'RESTAURANT_OWNER' && role !== 'ADMIN')) {
        alert('Access Restricted: Please login as a Restaurant Owner.');
        window.location.href = '/login.html';
    }

    document.getElementById('owner-name').innerText = `@${username}`;

    function loadReviews() {
        fetch(`http://localhost:8080/api/reviews/restaurant?username=${encodeURIComponent(username)}`)
            .then(r => r.json())
            .then(reviews => {
                const container = document.getElementById('reviews-container');
                const totalCount = reviews ? reviews.length : 0;
                document.getElementById('total-reviews-count').innerText = totalCount;

                if (!totalCount) {
                    document.getElementById('avg-rating').innerText = 'N/A';
                    document.getElementById('satisfaction-rate').innerText = 'N/A';
                    container.innerHTML = `
                        <div class="col-span-full bg-white p-12 rounded-3xl shadow-sm border border-gray-100 text-center">
                            <span class="text-5xl block mb-4">🌟</span>
                            <h3 class="text-xl font-bold text-gray-900">No reviews received yet</h3>
                            <p class="text-gray-500 text-sm mt-1">Once customers taste your dishes and rate them, their reviews will appear here.</p>
                        </div>
                    `;
                    return;
                }

                const totalStars = reviews.reduce((sum, r) => sum + (r.rating || 0), 0);
                const avg = (totalStars / totalCount).toFixed(1);
                document.getElementById('avg-rating').innerText = avg;

                const positive = reviews.filter(r => (r.rating || 0) >= 4).length;
                const satisfaction = Math.round((positive / totalCount) * 100);
                document.getElementById('satisfaction-rate').innerText = `${satisfaction}%`;

                container.innerHTML = reviews.map(r => {
                    const stars = '★'.repeat(r.rating || 5) + '☆'.repeat(5 - (r.rating || 5));
                    return `
                        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-bold uppercase tracking-wider">${r.dishName || 'Food Item'}</span>
                                        <h4 class="font-bold text-gray-900 mt-2">by ${r.customerName || 'Anonymous Customer'}</h4>
                                    </div>
                                    <div class="text-amber-500 text-lg tracking-widest">${stars}</div>
                                </div>
                                <p class="text-gray-600 text-sm italic mt-3 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                    "${r.comments || 'No comment provided.'}"
                                </p>
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(err => {
                console.error(err);
                document.getElementById('reviews-container').innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-3xl border border-red-100 text-center text-red-500">
                        Failed to load customer reviews from server.
                    </div>
                `;
            });
    }

    loadReviews();
</script>
</body>
</html>
