<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white">

<!-- Dynamic Navbar -->
<nav id="cravebite-nav"></nav>

<div class="max-w-4xl mx-auto mt-10 px-4 sm:px-6 lg:px-8 pb-20">
    <div class="flex justify-between items-end mb-10">
        <div>
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">My Reviews</h1>
            <p class="text-gray-500 mt-2 text-lg">Manage the feedback you've left for food and drivers (OOP Polymorphism).</p>
        </div>
        <a href="/submit-review.html" class="bg-gray-900 hover:bg-orange-500 text-white px-6 py-3 rounded-full font-bold transition shadow-lg flex items-center gap-2">
            <span>+</span> Leave a Review
        </a>
    </div>

    <div id="reviewsContainer" class="space-y-6">
        <div class="py-12 text-center text-gray-400 font-medium">Loading your reviews...</div>
    </div>
</div>

<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    function loadReviews() {
        fetch(`http://localhost:8080/api/reviews?username=${encodeURIComponent(username)}`)
            .then(res => res.json())
            .then(reviews => {
                const container = document.getElementById('reviewsContainer');
                if (!reviews || reviews.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-12 rounded-3xl border border-gray-100 text-center">
                            <span class="text-6xl mb-4 block">⭐</span>
                            <h3 class="text-2xl font-bold text-gray-900">No reviews yet</h3>
                            <p class="text-gray-500 mt-2 mb-6">You haven't left any reviews for your orders.</p>
                            <a href="/submit-review.html" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-3 rounded-full transition shadow">Leave a Review</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = reviews.map(r => {
                    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    const isFood = r.reviewCategory === 'Food Quality';
                    const categoryBadgeClass = isFood ? 'bg-orange-50 text-orange-600' : 'bg-blue-50 text-blue-600';
                    const icon = isFood ? '🍔' : '🛵';

                    return `
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-6 hover:shadow-xl hover:border-orange-200 transition-all">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <span class="px-3 py-1 text-xs font-bold uppercase tracking-widest rounded-full ${categoryBadgeClass} flex items-center gap-1">
                                    <span>${icon}</span> ${r.reviewCategory}
                                </span>
                                <div class="text-yellow-400 font-bold tracking-wider text-sm">
                                    ${stars} (${r.rating}/5)
                                </div>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">
                                ${r.reviewTargetName || 'General Feedback'}
                            </h3>
                            <p class="text-gray-600 font-medium italic">"${r.comments}"</p>
                        </div>
                        
                        <div class="flex items-center gap-3 shrink-0">
                            <a href="/review-edit.html?id=${r.id}" class="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition text-sm">
                                Edit
                            </a>
                            <button onclick="deleteReview(${r.id})" class="px-5 py-2.5 bg-red-50 text-red-600 font-bold rounded-xl hover:bg-red-100 transition text-sm">
                                Delete
                            </button>
                        </div>
                    </div>
                    `;
                }).join('');
            })
            .catch(err => {
                console.error("Failed to load reviews:", err);
            });
    }

    function deleteReview(id) {
        if (!confirm('Are you sure you want to delete this review?')) return;

        fetch(`http://localhost:8080/api/reviews/delete/${id}?username=${encodeURIComponent(username)}`, {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadReviews();
            } else {
                alert(data.error || 'Failed to delete review');
            }
        })
        .catch(err => {
            alert('Server error deleting review');
        });
    }

    document.addEventListener("DOMContentLoaded", loadReviews);
</script>
<script src="/js/navbar.js"></script>
</body>
</html>
