<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white">

<!-- Dynamic Navbar -->
<nav id="cravebite-nav"></nav>

<div class="max-w-5xl mx-auto mt-12 px-4 sm:px-6 lg:px-8 pb-24">
    <div class="flex justify-between items-end mb-10">
        <div>
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">Payment Methods</h1>
            <p class="text-gray-500 mt-2 text-lg">Securely manage your saved credit and debit cards (OOP Polymorphism).</p>
        </div>
        <a href="/payment-add.html" class="bg-gray-900 hover:bg-orange-500 text-white px-6 py-3 rounded-full font-bold transition shadow-lg flex items-center gap-2">
            <span>+</span> Add New Card
        </a>
    </div>

    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="col-span-full py-12 text-center text-gray-400 font-medium">Loading saved payment cards...</div>
    </div>
</div>

<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    function loadPaymentMethods() {
        fetch(`http://localhost:8080/api/payment/methods?username=${encodeURIComponent(username)}`)
            .then(res => res.json())
            .then(methods => {
                const container = document.getElementById('cardsContainer');
                if (!methods || methods.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-white p-12 rounded-3xl border border-gray-100 text-center">
                            <span class="text-5xl block mb-4">💳</span>
                            <h3 class="text-xl font-bold text-gray-900">No payment methods saved</h3>
                            <p class="text-gray-500 mt-2 mb-6">Save a Credit or Debit card to complete orders seamlessly.</p>
                            <a href="/payment-add.html" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2.5 rounded-full transition shadow">Add Card</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = methods.map(pm => {
                    const isCredit = pm.cardType === 'CREDIT';
                    const cardholder = (pm.cardholderName || 'CARDHOLDER').toUpperCase();
                    const masked = pm.maskedDetails || '•••• •••• •••• ••••';
                    const expiry = pm.expiryDate || '12/28';
                    const detail = pm.cardSpecificDetail || (isCredit ? 'Credit Card' : 'Debit Card');

                    const cardBg = isCredit 
                        ? 'bg-gradient-to-tr from-zinc-950 via-slate-900 to-zinc-800 border-zinc-700/60 shadow-2xl shadow-zinc-900/40 text-white'
                        : 'bg-gradient-to-tr from-slate-950 via-blue-950 to-indigo-900 border-blue-500/30 shadow-2xl shadow-blue-950/40 text-white';

                    const chipSvg = `
                        <svg class="w-12 h-9 rounded-md shrink-0 shadow-sm" viewBox="0 0 48 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="48" height="36" rx="6" fill="#EAB308"/>
                            <rect x="2" y="2" width="44" height="32" rx="4" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
                            <path d="M0 18H48M16 2V34M32 2V34M2 10H16M32 10H46M2 26H16M32 26H46" stroke="#A16207" stroke-width="1.2"/>
                            <circle cx="24" cy="18" r="4.5" fill="#EAB308" stroke="#CA8A04" stroke-width="1"/>
                        </svg>
                    `;

                    const waveSvg = `
                        <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 16.5a5 5 0 010-9M12 19a8.5 8.5 0 000-14M15.5 21.5a12 12 0 000-19" />
                        </svg>
                    `;

                    let brandSvg = isCredit ? `
                        <svg class="w-16 h-8 text-white drop-shadow" viewBox="0 0 100 32" fill="currentColor">
                            <text x="2" y="26" font-family="'Outfit', sans-serif" font-weight="900" font-size="30" font-style="italic" fill="white" letter-spacing="1">VISA</text>
                        </svg>
                    ` : `
                        <svg class="w-14 h-8 drop-shadow" viewBox="0 0 40 25" fill="none">
                            <circle cx="15" cy="12.5" r="10" fill="#EB001B" fill-opacity="0.95"/>
                            <circle cx="25" cy="12.5" r="10" fill="#F79E1B" fill-opacity="0.95"/>
                        </svg>
                    `;

                    return `
                    <div class="relative rounded-3xl p-7 border ${cardBg} transition-all duration-300 hover:scale-[1.02] flex flex-col justify-between h-[230px] overflow-hidden group">
                        
                        <!-- Top Row: Chip, Contactless Wave, and Brand Logo -->
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                ${chipSvg}
                                ${waveSvg}
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-widest uppercase bg-white/10 backdrop-blur border border-white/20">
                                    ${isCredit ? 'CREDIT' : 'DEBIT'}
                                </span>
                                ${brandSvg}
                            </div>
                        </div>

                        <!-- Middle Row: Embossed Masked Card Number -->
                        <div class="my-auto">
                            <p class="text-xl sm:text-2xl font-bold tracking-widest font-mono text-white/90 drop-shadow">
                                ${masked}
                            </p>
                        </div>

                        <!-- Bottom Row: Cardholder, Expiry, and Action Buttons -->
                        <div class="flex justify-between items-end pt-3 border-t border-white/10">
                            <div>
                                <span class="text-[9px] uppercase tracking-widest text-white/50 block font-bold">Cardholder</span>
                                <p class="text-sm font-extrabold tracking-wide text-white truncate max-w-[160px]">${cardholder}</p>
                                <span class="text-[10px] text-amber-300 font-semibold block">${detail}</span>
                            </div>

                            <div class="text-center">
                                <span class="text-[9px] uppercase tracking-widest text-white/50 block font-bold">Valid Thru</span>
                                <p class="text-xs font-mono font-bold tracking-wider text-white">${expiry}</p>
                            </div>

                            <div class="flex items-center gap-2">
                                <a href="/profile.html" class="px-3 py-1 bg-white/20 hover:bg-white/30 text-white font-bold rounded-lg text-xs backdrop-blur transition">
                                    Manage in Profile
                                </a>
                                <button onclick="deleteCard(${pm.id})" class="px-3 py-1 bg-red-500/40 hover:bg-red-500/60 text-red-200 hover:text-white font-bold rounded-lg text-xs backdrop-blur transition">
                                    Delete
                                </button>
                            </div>
                        </div>

                    </div>
                    `;
                }).join('');
            })
            .catch(err => {
                console.error("Failed to load cards:", err);
            });
    }

    function deleteCard(id) {
        if (!confirm('Are you sure you want to delete this payment method?')) return;

        fetch(`http://localhost:8080/api/payment/delete/${id}?username=${encodeURIComponent(username)}`, {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadPaymentMethods();
            } else {
                alert(data.error || 'Failed to delete card');
            }
        })
        .catch(err => {
            alert('Server error deleting card');
        });
    }

    document.addEventListener("DOMContentLoaded", loadPaymentMethods);
</script>
<script src="/js/navbar.js"></script>
</body>
</html>
