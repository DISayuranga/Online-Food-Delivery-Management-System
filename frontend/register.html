<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign Up - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-orange-500 selection:text-white" style="background-image: linear-gradient(135deg, rgba(17, 24, 39, 0.85) 0%, rgba(30, 18, 10, 0.80) 50%, rgba(17, 24, 39, 0.90) 100%), url('https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed;">

<!-- Navbar -->
<nav id="cravebite-nav"></nav>

<div class="flex-grow flex items-center justify-center p-4 py-12">
<div class="bg-white/95 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/40 w-full max-w-lg">
    <div class="text-center mb-8">
        <div class="inline-block bg-orange-100 text-orange-600 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-3">Customer Account</div>
        <h1 class="text-3xl font-black text-gray-900 tracking-tight">Join CraveBite</h1>
        <p class="text-gray-500 mt-1 font-medium">Order food from the best local favorites</p>
    </div>

    <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl relative mb-6 text-sm font-medium" role="alert">
        <span id="error-text"></span>
    </div>

    <form id="registerForm" class="space-y-4">
        <input type="hidden" name="role" value="CUSTOMER">
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="username" class="block text-sm font-bold text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required placeholder="johndoe"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
            </div>
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
            </div>
        </div>

        <div>
            <label for="fullName" class="block text-sm font-bold text-gray-700 mb-1">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe"
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
        </div>

        <div>
            <label for="email" class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com"
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
        </div>

        <div>
            <label for="phoneNumber" class="block text-sm font-bold text-gray-700 mb-1">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="077 123 4567"
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
        </div>

        <div>
            <label for="specificField" class="block text-sm font-bold text-gray-700 mb-1">Default Delivery Address</label>
            <input type="text" id="specificField" name="specificField" placeholder="123 Galle Road, Colombo"
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium outline-none focus:ring-2 focus:ring-orange-500 transition">
        </div>

        <div class="pt-4">
            <button type="submit"
                    class="w-full py-3.5 px-4 rounded-xl text-base font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/20 transition duration-150">
                Create Customer Account
            </button>
        </div>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm font-medium text-gray-600">Already have an account? 
            <a href="/login.html" class="font-bold text-orange-500 hover:text-orange-600">Sign in here</a>
        </p>
    </div>
</div>
</div>

<footer class="py-6 text-center text-xs text-white/70">
    <p>&copy; 2026 CraveBite Inc. All rights reserved.</p>
</footer>

<script src="/js/navbar.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    
    fetch('http://localhost:8080/api/register', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert('Account created! Please sign in with your credentials.');
            window.location.href = '/login.html';
        } else {
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-text').innerText = data.error;
        }
    })
    .catch(err => {
        document.getElementById('error-message').classList.remove('hidden');
        document.getElementById('error-text').innerText = 'Server error. Is the backend running?';
    });
});
</script>

</body>
</html>
