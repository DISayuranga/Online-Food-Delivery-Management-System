<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white">

<!-- Dynamic Navbar -->
<nav id="cravebite-nav"></nav>

<div class="max-w-7xl mx-auto mt-8 px-4 sm:px-6 lg:px-8 pb-24">
    
    <div class="mb-8 rounded-3xl p-8 md:p-10 relative overflow-hidden shadow-md flex flex-col md:flex-row justify-between md:items-end gap-6" style="background-image: linear-gradient(135deg, rgba(17, 24, 39, 0.90) 0%, rgba(30, 20, 10, 0.82) 50%, rgba(234, 88, 12, 0.88) 100%), url('https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
        <div class="relative z-10 max-w-2xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/30 backdrop-blur-md text-orange-200 text-xs font-black uppercase tracking-wider mb-3 border border-orange-400/30">
                🍽️ CraveBite Menu
            </div>
            <h1 id="page-title" class="text-3xl md:text-5xl font-black text-white tracking-tight">Order from Local Favorites</h1>
            <p id="page-subtitle" class="text-gray-200 mt-2 text-sm md:text-base font-medium">Discover delicious culinary creations prepared fresh and delivered fast.</p>
        </div>
        <div id="filter-banner" class="hidden items-center gap-3 bg-white/95 backdrop-blur-md border border-white/50 px-4 py-2.5 rounded-2xl relative z-10 shadow-lg">
            <span id="filter-text" class="text-xs font-bold text-gray-900"></span>
            <button onclick="clearFilters()" class="text-xs font-black text-white bg-orange-500 hover:bg-orange-600 px-3 py-1.5 rounded-xl shadow-xs transition">
                ✕ Clear All
            </button>
        </div>
    </div>

    <!-- Compact Right-Aligned Search Bar & Section Header -->
    <div class="mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div class="flex items-center gap-2">
            <span class="text-xs font-black uppercase tracking-widest text-gray-400">Categories</span>
            <span class="text-gray-300">•</span>
            <span class="text-xs text-gray-500 font-medium">Pick a category or search below</span>
        </div>
        <div class="w-full sm:w-72 md:w-80 relative ml-auto">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="food-search-input" oninput="handleSearchInput(event)" placeholder="Search dishes..." class="w-full pl-9 pr-8 py-2 bg-white border border-gray-200 hover:border-gray-300 rounded-full text-xs font-semibold text-gray-800 placeholder-gray-400 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 shadow-xs transition">
            <button id="clear-search-btn" onclick="clearSearchInput()" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-gray-400 hover:text-gray-600 transition">
                <span class="w-4 h-4 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-[10px] font-bold text-gray-600">✕</span>
            </button>
        </div>
    </div>

    <!-- Category Filters -->
    <div class="mb-8 overflow-x-auto pb-2 no-scrollbar">
        <div class="flex items-center gap-2 min-w-max">
            <button onclick="setCategoryFilter('ALL')" id="cat-ALL" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-orange-500 text-white">
                All Items
            </button>
            <button onclick="setCategoryFilter('Burgers')" id="cat-Burgers" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍔 Burgers
            </button>
            <button onclick="setCategoryFilter('Pizza')" id="cat-Pizza" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍕 Pizza
            </button>
            <button onclick="setCategoryFilter('Lunch')" id="cat-Lunch" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍱 Lunch
            </button>
            <button onclick="setCategoryFilter('Dinner')" id="cat-Dinner" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍽️ Dinner
            </button>
            <button onclick="setCategoryFilter('Juice')" id="cat-Juice" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🧃 Juice
            </button>
            <button onclick="setCategoryFilter('Sushi')" id="cat-Sushi" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍣 Sushi
            </button>
            <button onclick="setCategoryFilter('Healthy')" id="cat-Healthy" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🥗 Healthy
            </button>
            <button onclick="setCategoryFilter('Desserts')" id="cat-Desserts" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍰 Desserts
            </button>
            <button onclick="setCategoryFilter('Breakfast')" id="cat-Breakfast" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍳 Breakfast
            </button>
            <button onclick="setCategoryFilter('Beverages')" id="cat-Beverages" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🥤 Beverages
            </button>
            <button onclick="setCategoryFilter('Main Course')" id="cat-MainCourse" class="cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500">
                🍛 Main Course
            </button>
        </div>
    </div>

    <!-- Products Grid -->
    <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <!-- Products will be loaded here via JavaScript -->
        <div class="col-span-full text-center py-16 text-gray-400 font-medium animate-pulse">
            Loading delicious food items...
        </div>
    </div>
</div>

<script>
    let allProducts = [];
    let currentCategory = 'ALL';
    let currentRestaurantId = null;
    let currentRestaurantName = '';
    let currentSearchQuery = '';
    const currentUserRole = (localStorage.getItem('role') || '').toUpperCase();
    const currentUsername = localStorage.getItem('username');
    const isRestaurantOwner = (currentUserRole === 'RESTAURANT_OWNER' && currentUsername);

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const catParam = urlParams.get('category');
        const restIdParam = urlParams.get('restaurantId');
        const restNameParam = urlParams.get('restaurantName');
        const searchParam = urlParams.get('search') || urlParams.get('q');

        if (catParam) {
            currentCategory = catParam;
        }

        if (searchParam) {
            currentSearchQuery = searchParam;
            const searchInput = document.getElementById('food-search-input');
            if (searchInput) searchInput.value = searchParam;
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) clearBtn.classList.remove('hidden');
        }

        if (isRestaurantOwner) {
            document.getElementById('page-title').innerText = 'My Restaurant Menu';
            document.getElementById('page-subtitle').innerText = 'Viewing dishes exclusive to your kitchen. Other restaurants food items are hidden.';
            
            // Insert owner banner before categories
            const headerDiv = document.querySelector('.max-w-7xl');
            const ownerBanner = document.createElement('div');
            ownerBanner.className = 'mb-6 p-4 rounded-2xl bg-amber-50 border border-amber-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3';
            ownerBanner.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-xl">🏪</span>
                    <span class="text-xs font-bold text-amber-900">
                        Restaurant Mode: You can only view dishes belonging to your restaurant.
                    </span>
                </div>
                <a href="/product-add.html" class="px-4 py-2 bg-gray-900 hover:bg-orange-500 text-white font-bold text-xs rounded-xl transition shadow flex items-center gap-1.5 shrink-0">
                    <span>+</span> Add New Food Item
                </a>
            `;
            headerDiv.insertBefore(ownerBanner, document.querySelector('.mb-8.overflow-x-auto'));
        } else if (restIdParam) {
            currentRestaurantId = restIdParam;
            currentRestaurantName = restNameParam || 'Restaurant';
            document.getElementById('page-title').innerText = `${currentRestaurantName} Menu`;
            document.getElementById('page-subtitle').innerText = `Freshly prepared dishes crafted exclusively by ${currentRestaurantName}.`;
        }

        loadProducts();
    });

    function handleSearchInput(e) {
        currentSearchQuery = (e.target.value || '').trim();
        const clearBtn = document.getElementById('clear-search-btn');
        if (currentSearchQuery) {
            clearBtn.classList.remove('hidden');
        } else {
            clearBtn.classList.add('hidden');
        }
        const url = new URL(window.location.href);
        if (currentSearchQuery) {
            url.searchParams.set('search', currentSearchQuery);
        } else {
            url.searchParams.delete('search');
        }
        window.history.replaceState({}, '', url);
        applyFilters();
    }

    function clearSearchInput() {
        const input = document.getElementById('food-search-input');
        input.value = '';
        currentSearchQuery = '';
        document.getElementById('clear-search-btn').classList.add('hidden');
        const url = new URL(window.location.href);
        url.searchParams.delete('search');
        window.history.replaceState({}, '', url);
        applyFilters();
        input.focus();
    }

    function loadProducts() {
        let url = 'http://localhost:8080/api/products/list';
        if (isRestaurantOwner) {
            url += `?ownerUsername=${encodeURIComponent(currentUsername)}`;
        }
        fetch(url)
            .then(response => response.json())
            .then(data => {
                allProducts = data || [];
                applyFilters();
            })
            .catch(error => {
                console.error("Error fetching products:", error);
                document.getElementById('products-container').innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-3xl border border-red-200 text-center">
                        <span class="text-5xl block mb-3">⚠️</span>
                        <h3 class="text-xl font-bold text-red-600">Failed to load menu items</h3>
                        <p class="text-gray-500 text-sm mt-1">Please ensure the backend server is running on port 8080.</p>
                    </div>
                `;
            });
    }

    function setCategoryFilter(cat) {
        currentCategory = cat;
        // Update URL without full page reload
        const url = new URL(window.location.href);
        if (cat === 'ALL') {
            url.searchParams.delete('category');
        } else {
            url.searchParams.set('category', cat);
        }
        window.history.replaceState({}, '', url);
        applyFilters();
    }

    function clearFilters() {
        currentCategory = 'ALL';
        currentRestaurantId = null;
        currentRestaurantName = '';
        currentSearchQuery = '';
        const searchInput = document.getElementById('food-search-input');
        if (searchInput) searchInput.value = '';
        const clearBtn = document.getElementById('clear-search-btn');
        if (clearBtn) clearBtn.classList.add('hidden');
        window.history.replaceState({}, '', '/products-list.html');
        if (!isRestaurantOwner) {
            document.getElementById('page-title').innerText = 'Order from Local Favorites';
            document.getElementById('page-subtitle').innerText = 'Discover delicious culinary creations prepared fresh and delivered fast.';
        }
        applyFilters();
    }

    function applyFilters() {
        updateFilterPillsUI();

        let filtered = allProducts;

        if (currentRestaurantId) {
            filtered = filtered.filter(p => p.ownerId && String(p.ownerId) === String(currentRestaurantId));
        }

        if (currentCategory && currentCategory !== 'ALL') {
            const catLower = currentCategory.toLowerCase();
            filtered = filtered.filter(p => {
                const itemCat = (p.category || '').toLowerCase();
                const itemType = (p.itemType || '').toLowerCase();
                return itemCat.includes(catLower) || itemType.includes(catLower);
            });
        }

        if (currentSearchQuery) {
            const qLower = currentSearchQuery.toLowerCase();
            filtered = filtered.filter(p => {
                const name = (p.name || '').toLowerCase();
                const desc = (p.description || '').toLowerCase();
                const cat = (p.category || '').toLowerCase();
                const itemType = (p.itemType || '').toLowerCase();
                const restName = (p.restaurantName || '').toLowerCase();
                return name.includes(qLower) || desc.includes(qLower) || cat.includes(qLower) || itemType.includes(qLower) || restName.includes(qLower);
            });
        }

        // Update Filter Banner
        const banner = document.getElementById('filter-banner');
        const filterText = document.getElementById('filter-text');
        const activeCriteria = [];
        if (currentRestaurantId) {
            activeCriteria.push(`Restaurant: <b>${currentRestaurantName || 'Selected'}</b>`);
        }
        if (currentCategory !== 'ALL') {
            activeCriteria.push(`Category: <b>${currentCategory}</b>`);
        }
        if (currentSearchQuery) {
            activeCriteria.push(`Search: <b>"${escapeHtml(currentSearchQuery)}"</b>`);
        }

        if (activeCriteria.length > 0) {
            banner.classList.remove('hidden');
            banner.classList.add('flex');
            filterText.innerHTML = `Showing ${filtered.length} item(s) for ${activeCriteria.join(' & ')}`;
        } else {
            banner.classList.add('hidden');
            banner.classList.remove('flex');
        }

        renderProducts(filtered);
    }

    function resolveImageUrl(url) {
        if (!url) return '';
        if (url.startsWith('http://') || url.startsWith('https://')) return url;
        if (url.startsWith('/')) {
            if (window.location.port === '3000' || (window.location.port !== '8080' && window.location.port !== '')) {
                return 'http://localhost:8080' + url;
            }
        }
        return url;
    }

    function updateFilterPillsUI() {
        document.querySelectorAll('.cat-pill').forEach(btn => {
            btn.className = 'cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:border-orange-500';
        });

        let targetId = 'cat-ALL';
        if (currentCategory === 'Burgers') targetId = 'cat-Burgers';
        else if (currentCategory === 'Pizza') targetId = 'cat-Pizza';
        else if (currentCategory === 'Lunch') targetId = 'cat-Lunch';
        else if (currentCategory === 'Dinner') targetId = 'cat-Dinner';
        else if (currentCategory === 'Juice') targetId = 'cat-Juice';
        else if (currentCategory === 'Sushi') targetId = 'cat-Sushi';
        else if (currentCategory === 'Healthy') targetId = 'cat-Healthy';
        else if (currentCategory === 'Desserts') targetId = 'cat-Desserts';
        else if (currentCategory === 'Breakfast') targetId = 'cat-Breakfast';
        else if (currentCategory === 'Beverages') targetId = 'cat-Beverages';
        else if (currentCategory === 'Main Course') targetId = 'cat-MainCourse';

        const activeBtn = document.getElementById(targetId);
        if (activeBtn) {
            activeBtn.className = 'cat-pill px-5 py-2.5 rounded-full text-xs font-bold transition shadow-sm bg-orange-500 text-white';
        }
    }

    function renderProducts(items) {
        const container = document.getElementById('products-container');
        container.innerHTML = '';

        if (!items || items.length === 0) {
            if (currentSearchQuery) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-3xl shadow-sm border border-gray-100 text-center max-w-lg mx-auto my-6">
                        <span class="text-6xl mb-4 block animate-bounce">🔍</span>
                        <h3 class="text-2xl font-black text-gray-900">No dishes found matching "${escapeHtml(currentSearchQuery)}"</h3>
                        <p class="text-gray-500 mt-2 text-sm leading-relaxed">We could not find any food items matching your search. Try checking for typos or explore our popular categories.</p>
                        <div class="mt-6 flex justify-center gap-3">
                            <button onclick="clearSearchInput()" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition shadow shadow-orange-500/20">
                                Clear Search
                            </button>
                            <button onclick="clearFilters()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition">
                                View All Dishes
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const hasCat = currentCategory && currentCategory !== 'ALL';
            const catTitle = hasCat ? `in "${currentCategory}"` : '';

            let emptyTitle = `No dishes found ${catTitle}`;
            let emptyDesc = 'There are currently no items available under this category. You can browse other categories or view all dishes.';
            let actionBtn = `
                <button onclick="clearFilters()" class="mt-4 px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition shadow shadow-orange-500/20">
                    Browse All Dishes
                </button>
            `;

            if (isRestaurantOwner) {
                emptyTitle = hasCat 
                    ? `No ${currentCategory} items on your menu yet` 
                    : `You have not added any dishes yet`;
                emptyDesc = hasCat
                    ? `Your kitchen has not created any dishes in the <strong>${currentCategory}</strong> category yet. Click below to add your first dish to this category!`
                    : `Start creating your restaurant menu by adding culinary dishes with uploaded photos.`;
                actionBtn = `
                    <a href="/product-add.html" class="inline-block mt-4 px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition shadow shadow-orange-500/20">
                        + Add ${hasCat ? currentCategory : 'Food'} Item
                    </a>
                `;
            }

            container.innerHTML = `
                <div class="col-span-full bg-white p-12 rounded-3xl shadow-sm border border-gray-100 text-center max-w-lg mx-auto my-6">
                    <span class="text-6xl mb-4 block animate-bounce">🍽️</span>
                    <h3 class="text-2xl font-black text-gray-900">${emptyTitle}</h3>
                    <p class="text-gray-500 mt-2 text-sm leading-relaxed">${emptyDesc}</p>
                    <div class="mt-6">
                        ${actionBtn}
                    </div>
                </div>
            `;
            return;
        }

        items.forEach(item => {
            const basePrice = (item.basePrice || 0).toFixed(2);
            const finalPrice = (item.finalPrice !== undefined && item.finalPrice !== null ? item.finalPrice : item.basePrice).toFixed(2);
            const itemCat = item.category || item.itemType || 'Main Course';
            const restaurantName = item.restaurantName || 'Local Kitchen';
            const imgUrl = resolveImageUrl(item.imageUrl);
            
            let imageHtml = '';
            if (imgUrl) {
                imageHtml = `
                    <div class="h-52 bg-gray-100 relative overflow-hidden flex items-center justify-center">
                        <img src="${imgUrl}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60'">
                        <div class="absolute top-4 right-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-gray-900 shadow-sm border border-gray-100">
                            ${itemCat}
                        </div>
                    </div>`;
            } else {
                let emoji = '🍛';
                const lowerCat = itemCat.toLowerCase();
                if (lowerCat.includes('burger')) emoji = '🍔';
                else if (lowerCat.includes('pizza')) emoji = '🍕';
                else if (lowerCat.includes('lunch')) emoji = '🍱';
                else if (lowerCat.includes('dinner')) emoji = '🍽️';
                else if (lowerCat.includes('juice')) emoji = '🧃';
                else if (lowerCat.includes('sushi')) emoji = '🍣';
                else if (lowerCat.includes('dessert')) emoji = '🍰';
                else if (lowerCat.includes('beverage')) emoji = '🥤';
                else if (lowerCat.includes('healthy')) emoji = '🥗';
                else if (lowerCat.includes('breakfast')) emoji = '🍳';
                
                imageHtml = `
                    <div class="h-52 bg-orange-50/50 relative overflow-hidden flex items-center justify-center text-6xl group-hover:scale-105 transition-transform duration-500">
                        ${emoji}
                        <div class="absolute top-4 right-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-gray-900 shadow-sm border border-gray-100">
                            ${itemCat}
                        </div>
                    </div>`;
            }

            let actionHtml = '';
            if (item.available) {
                actionHtml = `
                    <button type="button" onclick="addToCart(${item.id}, 1)" class="w-full bg-gray-900 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-2xl transition duration-200 flex justify-center items-center gap-2 text-sm shadow">
                        Add to Cart <span>+</span>
                    </button>`;
            } else {
                actionHtml = `
                    <div class="w-full bg-gray-100 text-gray-400 font-bold py-3 px-4 rounded-2xl text-center cursor-not-allowed border border-gray-200 text-sm">
                        Sold Out
                    </div>`;
            }

            const cardHtml = `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-gray-100 flex flex-col justify-between group ${!item.available ? 'opacity-75' : ''}">
                    <div>
                        ${imageHtml}
                        <div class="p-6">
                            <div class="flex items-center gap-1.5 text-xs text-orange-600 font-bold mb-2">
                                <span>🏪</span>
                                <span class="truncate">${restaurantName}</span>
                            </div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-black text-gray-900 leading-tight group-hover:text-orange-500 transition-colors">${item.name}</h3>
                                <div class="text-right shrink-0 ml-2">
                                    <span class="text-[11px] text-gray-400 block line-through">Base: Rs. ${basePrice}</span>
                                    <span class="text-lg font-black text-orange-600">Rs. ${finalPrice}</span>
                                </div>
                            </div>
                            <p class="text-gray-500 text-xs mb-4 line-clamp-2">${item.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        ${actionHtml}
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    function addToCart(foodItemId, quantity) {
        const username = localStorage.getItem('username');
        if (!username) {
            alert('Please login first!');
            window.location.href = '/login.html';
            return;
        }

        fetch(`http://localhost:8080/api/cart/add?username=${username}&foodItemId=${foodItemId}&quantity=${quantity}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Added to cart!');
            } else {
                alert(data.error || 'Failed to add to cart');
            }
        });
    }

</script>
<script src="/js/navbar.js"></script>
</body>
</html>
