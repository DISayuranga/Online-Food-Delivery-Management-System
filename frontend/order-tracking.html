<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white flex flex-col">

<!-- Dynamic Role Navbar -->
<nav id="cravebite-nav"></nav>

<main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 pb-6 border-b border-gray-200">
        <div>
            <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">📍 Active Order Tracking</h1>
            <p class="text-gray-500 text-sm mt-1">Live status of your kitchen preparation and rider delivery.</p>
        </div>
        <div class="flex gap-2">
            <button onclick="loadOrders()" class="bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-xl border border-gray-200 text-xs font-bold transition shadow-sm">
                🔄 Refresh
            </button>
            <a href="/order-history.html" class="bg-gray-900 hover:bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow">
                View Past History
            </a>
        </div>
    </div>

    <div id="orders-container" class="space-y-6">
        <p class="text-gray-400 font-medium animate-pulse">Tracking active orders...</p>
    </div>
</main>

<footer class="bg-gray-900 py-8 text-gray-400 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs">
        <p>&copy; 2026 CraveBite Inc. All rights reserved.</p>
    </div>
</footer>

<script src="/js/navbar.js"></script>
<script>
    const username = localStorage.getItem('username');
    if (!username) window.location.href = '/login.html';

    function loadOrders() {
        fetch(`http://localhost:8080/api/orders/tracking?username=${encodeURIComponent(username)}`)
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('orders-container');
                const orders = data.orders || [];

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-12 rounded-3xl shadow-sm border border-gray-100 text-center">
                            <span class="text-5xl block mb-4">✅</span>
                            <h3 class="text-xl font-bold text-gray-900">No active orders right now</h3>
                            <p class="text-gray-500 text-sm mt-1">All your meals have been delivered. Visit our <a href="/products-list.html" class="text-orange-500 font-bold underline">Food Menu</a> to place a new order!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(o => {
                    let badgeClass = 'bg-blue-100 text-blue-700';
                    let progressText = 'Order placed, waiting for kitchen confirmation.';
                    let canCancel = false;

                    if (o.orderStatus === 'PLACED') {
                        badgeClass = 'bg-blue-100 text-blue-700';
                        progressText = 'Order received! Kitchen is about to start preparing.';
                        canCancel = true;
                    } else if (o.orderStatus === 'PREPARING') {
                        badgeClass = 'bg-amber-100 text-amber-700';
                        progressText = 'Kitchen is now freshly preparing your dishes.';
                    } else if (o.orderStatus === 'OUT_FOR_DELIVERY') {
                        badgeClass = 'bg-purple-100 text-purple-700';
                        progressText = `Order is on the road! Delivery Rider: ${o.riderName || 'Assigned rider'}.`;
                    }

                    const cancelButton = canCancel ? `
                        <button onclick="cancelOrder(${o.id})" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold transition border border-red-200">
                            Cancel Order
                        </button>
                    ` : '';

                    let itemsHtml = '';
                    const resolveImg = u => !u ? '' : (u.startsWith('/') && window.location.port !== '8080' ? 'http://localhost:8080' + u : u);
                    if (o.itemsList && o.itemsList.length > 0) {
                        itemsHtml = `
                            <div class="space-y-1.5 my-2">
                                ${o.itemsList.map(item => {
                                    let imgTag = item.imageUrl ? `<img src="${resolveImg(item.imageUrl)}" class="w-8 h-8 rounded-lg object-cover border border-gray-200 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60'">` : `<span class="text-base">🍛</span>`;
                                    return `
                                        <div class="flex items-center justify-between text-xs bg-white p-2 rounded-xl border border-gray-100">
                                            <div class="flex items-center gap-2">
                                                ${imgTag}
                                                <span class="font-bold text-gray-800">${item.quantity}x ${item.name}</span>
                                            </div>
                                            <span class="font-bold text-gray-700">${item.price ? 'Rs. ' + Number(item.price).toFixed(2) : ''}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    } else {
                        itemsHtml = `<p class="text-gray-700"><strong>Dishes:</strong> ${o.itemsSummary || 'Food items'}</p>`;
                    }

                    const schedTag = o.scheduledTime && o.scheduledTime.includes('Scheduled') 
                        ? `<span class="inline-block mt-1 bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full text-[11px] font-black">⏰ ${o.scheduledTime}</span>` 
                        : '';

                    return `
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h3 class="text-xl font-black text-gray-900">Order #${o.id}</h3>
                                        <span class="px-3 py-1 text-xs font-black rounded-full uppercase tracking-wider ${badgeClass}">${o.orderStatus}</span>
                                    </div>
                                    ${schedTag}
                                    <p class="text-xs text-gray-500 mt-1">Restaurant: <strong class="text-gray-800">${o.restaurantName}</strong></p>
                                </div>
                                <span class="text-2xl font-black text-orange-600">Rs. ${(o.totalAmount || 0).toFixed(2)}</span>
                            </div>

                            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 my-4 text-xs space-y-1.5">
                                ${itemsHtml}
                                <p class="text-gray-700"><strong>Drop-off Location:</strong> ${o.deliveryAddress || 'Standard Delivery'}</p>
                                <p class="text-orange-600 font-bold mt-1 text-sm">● ${progressText}</p>
                            </div>

                            <div class="flex justify-end gap-3 pt-2">
                                ${cancelButton}
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(err => {
                console.error(err);
                document.getElementById('orders-container').innerHTML = `<p class="text-red-500 text-center">Failed to load active orders.</p>`;
            });
    }

    function cancelOrder(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) return;
        fetch(`http://localhost:8080/api/orders/cancel/${orderId}?username=${encodeURIComponent(username)}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert('Order cancelled successfully.');
                    loadOrders();
                } else {
                    alert(data.error || 'Cannot cancel order once preparation has started.');
                }
            })
            .catch(err => alert('Server connection error.'));
    }

    loadOrders();
    setInterval(loadOrders, 10000);
</script>
</body>
</html>
