<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Delivery Address - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        #map { height: 260px; border-radius: 1rem; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white flex flex-col">

<!-- Dynamic Role Navbar -->
<nav id="cravebite-nav"></nav>

<main class="flex-grow max-w-2xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-gray-900">Add Delivery Address</h1>
            <p class="text-xs text-gray-500 mt-1">Select your exact location on the map or type your street address.</p>
        </div>
        <a href="/address-list.html" class="text-sm font-bold text-gray-500 hover:text-orange-500 transition">&larr; Back to Addresses</a>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        
        <!-- Interactive Map Picker -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">📍 Pin Location on Map</label>
                <button type="button" onclick="locateUser()" class="text-xs font-bold text-orange-600 hover:text-orange-700 flex items-center gap-1 bg-orange-50 px-3 py-1 rounded-full">
                    <span>🎯</span> Use Current Location
                </button>
            </div>
            <div id="map" class="border border-gray-200"></div>
            <p class="text-xs text-gray-400 mt-2 flex items-center justify-between">
                <span>Click anywhere on the map to pin your drop-off coordinates.</span>
                <span id="coordsDisplay" class="font-bold text-gray-600">6.9271, 79.8612</span>
            </p>
        </div>

        <form id="addressForm" class="space-y-5">
            <input type="hidden" name="latitude" id="latitude" value="6.9271">
            <input type="hidden" name="longitude" id="longitude" value="79.8612">

            <div>
                <label for="addressType" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Address Type</label>
                <select name="addressType" id="addressType" required onchange="updateSpecificFields()"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                    <option value="HOME">Home Address</option>
                    <option value="OFFICE">Office Address</option>
                </select>
            </div>

            <div>
                <label for="streetAddress" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Street Address</label>
                <input type="text" name="streetAddress" id="streetAddress" required placeholder="e.g. 123 Lotus Road, Colombo 03"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="city" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">City</label>
                    <input type="text" name="city" id="city" required placeholder="Colombo"
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>

                <div>
                    <label for="zipCode" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Zip Code</label>
                    <input type="text" name="zipCode" id="zipCode" required placeholder="00300"
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>
            </div>

            <div id="specificDetailsContainer">
                <label id="specificDetailsLabel" for="specificDetails" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Gate / Security Code</label>
                <input type="text" name="specificDetails" id="specificDetails" placeholder="e.g. Building A, Ring Bell #2"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div class="pt-4 border-t border-gray-100 flex gap-3">
                <a href="/address-list.html" class="w-1/2 py-3 px-4 text-center border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition">Cancel</a>
                <button type="submit"
                        class="w-1/2 py-3 px-4 rounded-xl text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/20 transition">
                    Save Address
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="bg-gray-900 py-8 text-gray-400 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs">
        <p>&copy; 2026 CraveBite Inc. All rights reserved.</p>
    </div>
</footer>

<script src="/js/navbar.js"></script>
<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    // Leaflet OpenStreetMap Initialization
    let map, marker;
    const defaultLat = 6.9271;
    const defaultLng = 79.8612;

    function initMap() {
        map = L.map('map').setView([defaultLat, defaultLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

        function updateCoords(lat, lng) {
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            document.getElementById('coordsDisplay').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }

        marker.on('dragend', function (e) {
            const pos = e.target.getLatLng();
            updateCoords(pos.lat, pos.lng);
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            updateCoords(e.latlng.lat, e.latlng.lng);
        });
    }

    function locateUser() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
                document.getElementById('latitude').value = lat.toFixed(6);
                document.getElementById('longitude').value = lng.toFixed(6);
                document.getElementById('coordsDisplay').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }, () => {
                alert('Could not retrieve your GPS location. Please click on the map directly.');
            });
        }
    }

    function updateSpecificFields() {
        const type = document.getElementById("addressType").value;
        const label = document.getElementById("specificDetailsLabel");
        const input = document.getElementById("specificDetails");

        if (type === "HOME") {
            label.innerText = "Gate/Security Code";
            input.placeholder = "e.g., Gate code #1234";
        } else if (type === "OFFICE") {
            label.innerText = "Floor & Company Name";
            input.placeholder = "e.g., Level 5, Tech Park";
        }
    }

    document.getElementById('addressForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        const params = new URLSearchParams();
        params.append('username', username);
        params.append('addressType', fd.get('addressType'));
        params.append('streetAddress', fd.get('streetAddress'));
        params.append('city', fd.get('city'));
        params.append('zipCode', fd.get('zipCode'));
        params.append('specificDetails', fd.get('specificDetails') || '');
        params.append('latitude', fd.get('latitude') || '6.9271');
        params.append('longitude', fd.get('longitude') || '79.8612');

        fetch('http://localhost:8080/api/address/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/address-list.html';
            } else {
                alert(data.error || 'Failed to save address');
            }
        })
        .catch(err => {
            alert('Server error saving address');
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        initMap();
        updateSpecificFields();
    });
</script>
</body>
</html>
