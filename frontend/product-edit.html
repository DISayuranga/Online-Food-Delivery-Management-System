<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white flex flex-col">

<!-- Dynamic Role Navbar -->
<nav id="cravebite-nav"></nav>

<main class="flex-grow max-w-2xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-gray-900">Edit Menu Item</h1>
            <p class="text-xs text-gray-500 mt-1">Update price, description, dish photo, and availability.</p>
        </div>
        <a href="/product-add.html" class="text-sm font-bold text-gray-500 hover:text-orange-500 transition">&larr; Back to Food Items</a>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        
        <div class="bg-orange-50 border-l-4 border-orange-400 p-4 mb-6 rounded-r-2xl">
            <p class="text-sm text-orange-900 font-medium">
                Category: <span id="itemTypeBadge" class="font-bold"></span> dish.
                Current computed price: <span id="finalPriceBadge" class="font-bold text-orange-600"></span>
            </p>
        </div>

        <form id="editProductForm" class="space-y-6">
            <div>
                <label for="name" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Item Name</label>
                <input type="text" name="name" id="name" required
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div>
                <label for="description" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Description</label>
                <textarea name="description" id="description" rows="3" required
                          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="basePrice" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Base Price (Rs.)</label>
                    <input type="number" step="0.01" name="basePrice" id="basePrice" required min="1"
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Change Dish Photo (from device)</label>
                    <div class="flex items-center gap-3">
                        <label class="flex-1 flex flex-col items-center justify-center p-3.5 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-orange-500 hover:bg-orange-50/20 transition">
                            <span class="text-xs font-bold text-gray-600" id="edit-file-label-text">📁 Upload New Image</span>
                            <span class="text-[10px] text-gray-400 mt-0.5">Leave blank to keep existing photo</span>
                            <input type="file" name="imageFile" id="editImageFileInput" accept="image/*" class="hidden" onchange="handleEditImagePreview(this)">
                        </label>
                        <div id="editImagePreviewContainer" class="w-16 h-16 rounded-xl bg-gray-100 border border-gray-200 overflow-hidden shrink-0">
                            <img id="editImagePreview" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60" alt="Current Photo" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <input id="available" name="available" type="checkbox" class="w-5 h-5 text-orange-500 rounded border-gray-300 focus:ring-orange-500">
                <label for="available" class="text-sm font-bold text-gray-700">
                    Available for Ordering
                </label>
            </div>

            <div class="pt-4 border-t border-gray-100 flex gap-3">
                <a href="/product-add.html" class="w-1/2 py-3 px-4 text-center border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition">Cancel</a>
                <button type="submit"
                        class="w-1/2 py-3 px-4 rounded-xl text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/20 transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="bg-gray-900 py-8 text-gray-400 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs">
        <p>&copy; 2026 CraveBite Inc. Restaurant Operations.</p>
    </div>
</footer>

<script src="/js/navbar.js"></script>
<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    const productId = new URLSearchParams(window.location.search).get('id');
    if (!productId) {
        alert('Invalid product ID');
        window.location.href = '/product-add.html';
    }

    fetch(`http://localhost:8080/api/products/edit/${productId}?username=${encodeURIComponent(username)}`)
        .then(res => {
            if (!res.ok) throw new Error('Not found');
            return res.json();
        })
        .then(p => {
            document.getElementById('itemTypeBadge').innerText = p.itemType || 'Food Item';
            document.getElementById('finalPriceBadge').innerText = `Rs. ${(p.finalPrice || p.basePrice).toFixed(2)}`;
            document.getElementById('name').value = p.name || '';
            document.getElementById('description').value = p.description || '';
            document.getElementById('basePrice').value = p.basePrice || 0;
            if (p.imageUrl) {
                document.getElementById('editImagePreview').src = p.imageUrl;
            }
            document.getElementById('available').checked = p.available === true;
        })
        .catch(err => {
            alert('Failed to load product details');
            window.location.href = '/product-add.html';
        });

    function handleEditImagePreview(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            document.getElementById('edit-file-label-text').innerText = `✓ ${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('editImagePreview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('editProductForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        fd.append('username', username);
        fd.set('available', document.getElementById('available').checked ? 'true' : 'false');

        fetch(`http://localhost:8080/api/products/edit/${productId}`, {
            method: 'POST',
            body: fd
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Product updated successfully!');
                window.location.href = '/product-add.html';
            } else {
                alert(data.error || 'Failed to update product');
            }
        })
        .catch(err => {
            alert('Server error updating product');
        });
    });
</script>
</body>
</html>
