<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Delivery System</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<!-- Navbar -->
<nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-20 items-center">
            <div class="flex items-center gap-8">
                <a href="/index.html" class="flex items-center gap-2">
                    <div class="bg-orange-500 p-2 rounded-xl">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <span class="text-2xl font-black text-gray-900 tracking-tight">CraveBite<span class="text-orange-500">.</span></span>
                </a>
                <div class="hidden md:flex items-center space-x-6 text-sm font-bold text-gray-600">
                    <a href="/index.html" class="hover:text-orange-500 transition">Home</a>
                    <a href="/products-list.html" class="hover:text-orange-500 transition">Menu</a>
                    <a href="/about.html" class="hover:text-orange-500 transition">Our Story</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/register.html" class="bg-gray-900 text-white px-5 py-2 rounded-full hover:bg-orange-500 transition-colors shadow text-sm font-bold">Sign up</a>
            </div>
        </div>
    </div>
</nav>

<div class="flex-grow flex items-center justify-center p-4 py-12">
<div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
        <p class="text-gray-500 mt-2">Login to your account</p>
    </div>

    <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-sm" role="alert">
        <span id="error-text" class="block sm:inline"></span>
    </div>

    <form id="loginForm" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" id="username" name="username" required
                   class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                Sign In
            </button>
        </div>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">Don't have an account? 
            <a href="/register.html" class="font-medium text-blue-600 hover:text-blue-500">Register here</a>
        </p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    
    fetch('http://localhost:8080/api/login', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem('username', data.username);
            const role = data.roleType || data.role || 'CUSTOMER';
            localStorage.setItem('role', role);
            if (data.fullName) localStorage.setItem('fullName', data.fullName);

            // Role-based smart redirect
            if (role === 'ADMIN') {
                window.location.href = '/admin-dashboard.html';
            } else if (role === 'RESTAURANT_OWNER') {
                window.location.href = '/restaurant-orders.html';
            } else if (role === 'RIDER') {
                window.location.href = '/rider-orders.html';
            } else {
                window.location.href = '/products-list.html';
            }
        } else {
            // Show error message box
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-text').innerText = data.error;
        }
    })
    .catch(err => {
        console.error("Login failed:", err);
        document.getElementById('error-message').classList.remove('hidden');
        document.getElementById('error-text').innerText = 'Server error. Is the Java backend running?';
    });
});
</script>

</div>
<script src="/js/navbar.js"></script>
</body>
</html>
