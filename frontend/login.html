<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CraveBite</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-orange-500 selection:text-white" style="background-image: linear-gradient(135deg, rgba(17, 24, 39, 0.85) 0%, rgba(30, 18, 10, 0.80) 50%, rgba(17, 24, 39, 0.90) 100%), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed;">

<!-- Dynamic Navbar -->
<nav id="cravebite-nav"></nav>

<div class="flex-grow flex items-center justify-center p-4 py-12">
    <div class="bg-white/95 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/40 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-orange-500 rounded-2xl text-white text-2xl shadow-lg shadow-orange-500/30 mb-4">
                🍔
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">Welcome Back</h1>
            <p class="text-gray-500 mt-1 text-sm font-medium">Log in to manage orders, dishes or deliveries</p>
        </div>

        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl relative mb-6 text-sm font-medium" role="alert">
            <span id="error-text"></span>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold text-gray-900 outline-none focus:border-orange-500 focus:bg-white transition">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-700">Password</label>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold text-gray-900 outline-none focus:border-orange-500 focus:bg-white transition">
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/25 transition duration-150 flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <span>➔</span>
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs font-medium text-gray-600">Don't have an account? 
                <a href="/register.html" class="font-bold text-orange-500 hover:text-orange-600 underline ml-1">Sign up here</a>
            </p>
        </div>
    </div>
</div>

<footer class="py-6 text-center text-xs text-white/70">
    <p>&copy; 2026 CraveBite Inc. All rights reserved.</p>
</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    
    fetch('http://localhost:8080/api/login', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem('username', data.username);
            const role = data.roleType || data.role || 'CUSTOMER';
            localStorage.setItem('role', role);
            if (data.fullName) localStorage.setItem('fullName', data.fullName);

            // Role-based smart redirect
            if (role === 'ADMIN') {
                window.location.href = '/admin-dashboard.html';
            } else if (role === 'RESTAURANT_OWNER') {
                window.location.href = '/restaurant-orders.html';
            } else if (role === 'RIDER') {
                window.location.href = '/rider-orders.html';
            } else {
                window.location.href = '/products-list.html';
            }
        } else {
            // Show error message box
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-text').innerText = data.error;
        }
    })
    .catch(err => {
        console.error("Login failed:", err);
        document.getElementById('error-message').classList.remove('hidden');
        document.getElementById('error-text').innerText = 'Server error. Is the Java backend running?';
    });
});
</script>

<script src="/js/navbar.js"></script>
</body>
</html>
