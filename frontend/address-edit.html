<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Address - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        #map { height: 260px; border-radius: 1rem; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-orange-500 selection:text-white flex flex-col">

<!-- Dynamic Role Navbar -->
<nav id="cravebite-nav"></nav>

<main class="flex-grow max-w-2xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-gray-900">Edit Address</h1>
            <p class="text-xs text-gray-500 mt-1">Adjust street address, postal code, or map pin coordinates.</p>
        </div>
        <a href="/address-list.html" class="text-sm font-bold text-gray-500 hover:text-orange-500 transition">&larr; Back to Addresses</a>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        
        <!-- Interactive Map Picker -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700">📍 Adjust Pin on Map</label>
                <button type="button" onclick="locateUser()" class="text-xs font-bold text-orange-600 hover:text-orange-700 flex items-center gap-1 bg-orange-50 px-3 py-1 rounded-full">
                    <span>🎯</span> Use Current Location
                </button>
            </div>
            <div id="map" class="border border-gray-200"></div>
            <p class="text-xs text-gray-400 mt-2 flex items-center justify-between">
                <span>Drag the pin or click on map to reposition coordinates.</span>
                <span id="coordsDisplay" class="font-bold text-gray-600">6.9271, 79.8612</span>
            </p>
        </div>

        <form id="editAddressForm" class="space-y-5">
            <input type="hidden" name="latitude" id="latitude" value="6.9271">
            <input type="hidden" name="longitude" id="longitude" value="79.8612">

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Address Type</label>
                <input type="text" id="addressTypeDisplay" disabled
                       class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium text-gray-500 outline-none">
            </div>

            <div>
                <label for="streetAddress" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Street Address</label>
                <input type="text" name="streetAddress" id="streetAddress" required
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="city" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">City</label>
                    <input type="text" name="city" id="city" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>

                <div>
                    <label for="zipCode" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Zip Code</label>
                    <input type="text" name="zipCode" id="zipCode" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>
            </div>

            <div>
                <label id="specificDetailsLabel" for="specificDetails" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">Specific Detail</label>
                <input type="text" name="specificDetails" id="specificDetails"
                       class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div class="pt-4 border-t border-gray-100 flex gap-3">
                <a href="/address-list.html" class="w-1/2 py-3 px-4 text-center border border-gray-200 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-100 transition">Cancel</a>
                <button type="submit"
                        class="w-1/2 py-3 px-4 rounded-xl text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 shadow-lg shadow-orange-500/20 transition">
                    Update Address
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="bg-gray-900 py-8 text-gray-400 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs">
        <p>&copy; 2026 CraveBite Inc. All rights reserved.</p>
    </div>
</footer>

<script src="/js/navbar.js"></script>
<script>
    const username = localStorage.getItem('username');
    if (!username) {
        window.location.href = '/login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const addressId = urlParams.get('id');
    if (!addressId) {
        window.location.href = '/address-list.html';
    }

    let map, marker;
    let initialLat = 6.9271;
    let initialLng = 79.8612;

    function initMap(lat, lng) {
        map = L.map('map').setView([lat, lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        marker = L.marker([lat, lng], { draggable: true }).addTo(map);

        function updateCoords(newLat, newLng) {
            document.getElementById('latitude').value = newLat.toFixed(6);
            document.getElementById('longitude').value = newLng.toFixed(6);
            document.getElementById('coordsDisplay').innerText = `${newLat.toFixed(4)}, ${newLng.toFixed(4)}`;
        }

        marker.on('dragend', function (e) {
            const pos = e.target.getLatLng();
            updateCoords(pos.lat, pos.lng);
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            updateCoords(e.latlng.lat, e.latlng.lng);
        });
    }

    function locateUser() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
                document.getElementById('latitude').value = lat.toFixed(6);
                document.getElementById('longitude').value = lng.toFixed(6);
                document.getElementById('coordsDisplay').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        }
    }

    fetch(`http://localhost:8080/api/address/edit/${addressId}?username=${encodeURIComponent(username)}`)
        .then(res => {
            if (!res.ok) throw new Error('Not found');
            return res.json();
        })
        .then(data => {
            document.getElementById('addressTypeDisplay').value = data.addressType;
            document.getElementById('streetAddress').value = data.streetAddress;
            document.getElementById('city').value = data.city;
            document.getElementById('zipCode').value = data.zipCode;

            if (data.addressType === 'Home Address') {
                document.getElementById('specificDetailsLabel').innerText = "Gate/Security Code (Optional)";
                document.getElementById('specificDetails').value = data.gateSecurityCode || '';
            } else {
                document.getElementById('specificDetailsLabel').innerText = "Floor & Company Name";
                document.getElementById('specificDetails').value = data.floorCompanyDetails || '';
            }

            const lat = data.latitude || 6.9271;
            const lng = data.longitude || 79.8612;
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            document.getElementById('coordsDisplay').innerText = `${Number(lat).toFixed(4)}, ${Number(lng).toFixed(4)}`;

            initMap(lat, lng);
        })
        .catch(err => {
            alert('Could not fetch address details');
            window.location.href = '/address-list.html';
        });

    document.getElementById('editAddressForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        const params = new URLSearchParams();
        params.append('username', username);
        params.append('streetAddress', fd.get('streetAddress'));
        params.append('city', fd.get('city'));
        params.append('zipCode', fd.get('zipCode'));
        params.append('specificDetails', fd.get('specificDetails') || '');
        params.append('latitude', fd.get('latitude'));
        params.append('longitude', fd.get('longitude'));

        fetch(`http://localhost:8080/api/address/edit/${addressId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/address-list.html';
            } else {
                alert(data.error || 'Failed to update address');
            }
        })
        .catch(err => {
            alert('Server error updating address');
        });
    });
</script>
</body>
</html>
